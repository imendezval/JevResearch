[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jevresearch"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
vision = ["torch==2.5.1", "torchvision==0.20.1", "numpy>=1.24,<3"]
jev = ["typesafe-sdk==0.7.1"]
classical = ["optuna==5.0.0", "cmaes==0.12.0"]

[project.scripts]
jevresearch = "jevresearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
